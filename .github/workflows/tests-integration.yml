# Tests d'intégration (cahier des charges §10) : integration_test/ exécuté
# sur un émulateur Android, avec la vraie application (stockage sécurisé,
# base chiffrée, Argon2id). Lancés sur les pull requests, quand les tests
# d'intégration changent, ou à la demande (environ 20 minutes).
name: Tests d'intégration

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['**']
    paths:
      - 'integration_test/**'
      - '.github/workflows/tests-integration.yml'

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Accélération matérielle (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tests sur émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          # Seulement le parcours fonctionnel : la visite en captures
          # (visite_test.dart) est lancée par la recette « Aperçu iOS ».
          script: flutter test integration_test/app_test.dart -d emulator-5554 --reporter expanded
