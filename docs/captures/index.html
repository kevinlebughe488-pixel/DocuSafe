<style>
  body { font-family: system-ui, sans-serif; margin: 24px; background: #FAF9FE; color: #1A1B1F; }
  h1 { font-weight: 500; }
  p { max-width: 70ch; color: #434750; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 24px; }

  figcaption { grid-column: 1 / -1; font-size: 14px; padding: 4px 4px 0; }

<h1>DocuSafe – captures d'écran de la phase 3</h1>
<p>Rendu réel de l'application Flutter (360 × 800 points, densité 3), en clair et en sombre. Produites par le test <code>test/screenshots/screenshots_test.dart</code> avec la commande <code>DOCUSAFE_SCREENSHOTS=1 flutter test test/screenshots --update-goldens</code>.</p>
<div class="grid">
